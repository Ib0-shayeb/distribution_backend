<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Tracker - Driver Terminal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; font-size: 1.6rem; }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        label { font-size: 0.85rem; color: #94a3b8; font-weight: 600; }
        input, button {
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            border: 1px solid #334155;
        }
        input {
            background-color: #0f172a;
            color: white;
        }
        button {
            background-color: #22c55e;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.active { background-color: #ef4444; color: white; }
        .telemetry-display {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.9rem;
            border-left: 4px solid #64748b;
            margin-bottom: 15px;
        }
        .status-badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #64748b;
            margin-right: 6px;
        }
        .status-badge.streaming { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            text-align: center;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card" id="loginPanel">
        <h2>Driver Login</h2>
        <hr style="border-color: #334155; margin-bottom: 20px;">
        <div class="error-msg" id="loginError">Invalid credentials. Try again.</div>
        
        <div class="form-group">
            <label for="usernameInput">Username</label>
            <input type="text" id="usernameInput" placeholder="e.g. amjad_driver" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="passwordInput">Password</label>
            <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button id="loginBtn" style="width: 100%;">AUTHENTICATE TERMINAL</button>
    </div>

    <div class="card" id="telemetryPanel" style="display: none;">
        <h2>Driver Node: <span id="driverNameTxt" style="color: white;">...</span></h2>
        <hr style="border-color: #334155; margin-bottom: 20px;">

        <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px dashed #334155;">
            <input type="checkbox" id="mockSimToggle" style="width: 18px; height: 18px; cursor: pointer;">
            <label for="mockSimToggle" style="cursor: pointer; color: #38bdf8; margin: 0;">Run Virtual Drive Simulator</label>
        </div>

        <div class="telemetry-display">
            <div><span id="badge" class="status-badge"></span>Status: <span id="statusTxt">Offline</span></div>
            <div style="margin-top: 8px;">Latitude:  <span id="latTxt">0.000000</span></div>
            <div>Longitude: <span id="lonTxt">0.000000</span></div>
            <div>Payloads:  <span id="countTxt">0</span> sent</div>
        </div>

        <button id="actionBtn" style="width: 100%; margin-bottom: 10px;">START SHIFT TRANSMISSION</button>
        <button id="logoutBtn" style="width: 100%; background-color: #334155; color: #94a3b8;">LOGOUT FROM TERMINAL</button>
    </div>

    <script>
        // Session security variables cache
        let jwtToken = null;
        let authenticatedUserId = null;

        let isTracking = false;
        let watchId = null;
        let simIntervalId = null;
        let payloadCount = 0;

        // Mock starting coordinates near Warsaw center framework parameters
        let mockLat = 52.2297;
        let mockLon = 21.0122;

        // DOM Nodes
        const loginPanel = document.getElementById('loginPanel');
        const telemetryPanel = document.getElementById('telemetryPanel');
        const loginBtn = document.getElementById('loginBtn');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginError = document.getElementById('loginError');
        const driverNameTxt = document.getElementById('driverNameTxt');
        
        const actionBtn = document.getElementById('actionBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const mockSimToggle = document.getElementById('mockSimToggle');
        const statusTxt = document.getElementById('statusTxt');
        const badge = document.getElementById('badge');
        const latTxt = document.getElementById('latTxt');
        const lonTxt = document.getElementById('lonTxt');
        const countTxt = document.getElementById('countTxt');

        // --- Authentication Event Handlers ---
        loginBtn.onclick = async () => {
            loginError.style.display = 'none';
            loginError.style.color = '#ef4444'; // Keep text red
            
            const payload = {
                username: usernameInput.value,
                password: passwordInput.value
            };

            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Handle HTTP Client/Server status codes
                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error("INVALID_CREDENTIALS");
                    } else {
                        throw new Error("SERVER_ERROR");
                    }
                }

                const data = await response.json();
                
                // Cache cryptographic pass data elements securely in scope memory
                jwtToken = data.token;
                authenticatedUserId = data.userId;
                driverNameTxt.innerText = data.name;

                // View swap visibility layout context
                loginPanel.style.display = 'none';
                telemetryPanel.style.display = 'block';
                
                // Reset credential field logs safely
                passwordInput.value = '';

            } catch (err) {
                console.error("Login attempt failure details:", err);
                
                // Switch message context based on error type
                if (err.message === "INVALID_CREDENTIALS") {
                    loginError.innerText = "Invalid username or password. Try again.";
                } else if (err.message === "SERVER_ERROR") {
                    loginError.innerText = "Internal server error occurred (500). Contact Dispatch.";
                } else {
                    // Browser fetch throws generic error if the remote connection drops entirely or CORS fails
                    loginError.innerText = "Unable to connect to server. Check your network or backend status.";
                }
                
                loginError.style.display = 'block';
            }
        };

        logoutBtn.onclick = () => {
            stopTransmission();
            jwtToken = null;
            authenticatedUserId = null;
            telemetryPanel.style.display = 'none';
            loginPanel.style.display = 'block';
        };

        // --- Telemetry Lifecycle Rules ---
        actionBtn.onclick = () => {
            if (!isTracking) {
                startTransmission();
            } else {
                stopTransmission();
            }
        };

        function startTransmission() {
            isTracking = true;
            mockSimToggle.disabled = true;
            actionBtn.innerText = "STOP TRANSMISSION";
            actionBtn.classList.add('active');
            statusTxt.innerText = "Initializing connection...";
            badge.classList.add('streaming');

            if (mockSimToggle.checked) {
                statusTxt.innerText = "Streaming Virtual GPS Telemetry 🤖";
                simIntervalId = setInterval(() => {
                    mockLat += (Math.random() - 0.5) * 0.0005;
                    mockLon += (Math.random() - 0.5) * 0.0005;
                    
                    updateDisplay(mockLat, mockLon);
                    transmitPayload(mockLat, mockLon);
                }, 4000);
            } else {
                if (!("geolocation" in navigator)) {
                    alert("Geolocation APIs are completely unavailable on this device.");
                    stopTransmission();
                    return;
                }

                statusTxt.innerText = "Awaiting Hardware Sat Sync 📡";
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        statusTxt.innerText = "Streaming Live Mobile GPS 🟢";
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        updateDisplay(lat, lon);
                        transmitPayload(lat, lon);
                    },
                    (err) => {
                        console.error(err);
                        statusTxt.innerText = `GPS Error: ${err.message}`;
                    },
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            }
        }

        function stopTransmission() {
            isTracking = false;
            mockSimToggle.disabled = false;
            actionBtn.innerText = "START SHIFT TRANSMISSION";
            actionBtn.classList.remove('active');
            statusTxt.innerText = "Offline";
            badge.classList.remove('streaming');

            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (simIntervalId) {
                clearInterval(simIntervalId);
                simIntervalId = null;
            }
        }

        function updateDisplay(lat, lon) {
            latTxt.innerText = lat.toFixed(6);
            lonTxt.innerText = lon.toFixed(6);
        }

        async function transmitPayload(lat, lon) {
            const payload = {
                userId: authenticatedUserId, // Use authenticated user contextual metadata
                latitude: parseFloat(lat.toFixed(6)),
                longitude: parseFloat(lon.toFixed(6))
            };

            try {
                const response = await fetch('http://localhost:8080/api/locations/log', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${jwtToken}` // Inject signature pass safely into Header pipes
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    payloadCount++;
                    countTxt.innerText = payloadCount;
                } else if (response.status === 401 || response.status === 403) {
                    console.warn("Token expired or dropped by interceptor security rules. Forcing logout.");
                    logoutBtn.click();
                } else {
                    console.error(`Backend Ingestion rejected packet status: ${response.status}`);
                }
            } catch (err) {
                console.error("Packet dispatch failure:", err);
            }
        }
    </script>
</body>
</html>
